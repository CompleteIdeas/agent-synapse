## AWM serves both memory and coordination on port 8400.
## The legacy packages/coordinator (port 8410) is DEPRECATED — do not use.

services:
  awm:
    build: packages/awm
    ports: ["127.0.0.1:8400:8400"]
    volumes: ["./data:/data"]
    environment:
      AWM_DB_PATH: /data/memory.db
      AWM_COORDINATION: "true"
      AWM_PORT: "8400"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8400/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  task-manager:
    build: packages/task-manager
    ports: ["127.0.0.1:8420:8420"]
    volumes: ["./data:/data"]
    environment:
      TM_DB_PATH: /data/task.db
      TM_API_KEY: ${TM_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8420/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
