## AWM serves both memory and coordination on port 8400.
## The legacy packages/coordinator (port 8410) is DEPRECATED — do not use.

services:
  awm:
    build: packages/awm
    ports: ["127.0.0.1:8400:8400"]
    volumes: ["./data:/data"]
    environment:
      AWM_DB_PATH: /data/memory.db
      AWM_COORDINATION: "true"
      AWM_PORT: "8400"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8400/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  ## task-manager: legacy — now consolidated into AWM on port 8400
  ## The packages/task-manager code still exists but is no longer run as a separate service.
